services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: veyrix
      POSTGRES_PASSWORD: veyrix_local
      POSTGRES_DB: veyrix
    ports: ["127.0.0.1:58439:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyrix"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
