name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veyrix
          POSTGRES_PASSWORD: veyrix_local
          POSTGRES_DB: veyrix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veyrix"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://veyrix:veyrix_local@localhost:5432/veyrix
      TEST_DATABASE_URL: postgresql+psycopg://veyrix:veyrix_local@localhost:5432/veyrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: ruff check .
      - run: pytest
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Demo build has no API proxy
        env:
          NEXT_PUBLIC_VEYRIX_DEMO: "true"
        run: |
          npm run build
          if grep -R "127.0.0.1:8000" .next/routes-manifest.json; then
            echo "demo build still proxies the API" >&2
            exit 1
          fi
